# Run after SeedCategories to demo both provider types in Plumbing.
mutation SeedProviderDirectory @auth(level: NO_ACCESS) {
  independent: user_upsert(data: {
    uid: "demo-independent"
    email: "independent@example.test"
    displayName: "Demo Technician"
    providerName: "Demo Technician"
    providerType: INDEPENDENT
    providerStatus: ACTIVE
    serviceArea: "Sen Sok"
  })
  company: user_upsert(data: {
    uid: "demo-company"
    email: "company@example.test"
    displayName: "Demo Repair Company"
    providerName: "Demo Repair Company"
    providerType: COMPANY
    providerStatus: ACTIVE
    serviceArea: "Toul Kork"
  })
  independentService: service_upsert(data: {
    id: "22222222-0000-0000-0000-000000000001"
    providerUid: "demo-independent"
    categoryId: "11111111-0000-0000-0000-000000000001"
    title: "Pipe repair"
