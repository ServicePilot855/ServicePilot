name: service_pilot
description: ServicePilot - Home repair & maintenance booking app
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  go_router: ^14.0.0
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.9
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  gap: ^3.0.1
  email_validator: ^3.0.0

  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.3
  firebase_data_connect: ^0.1.0+1
  cloud_firestore: ^5.6.12
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  image_picker: ^1.2.4
  firebase_storage: ^12.4.10
  http: ^1.6.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  fake_cloud_firestore: ^3.1.0

flutter:
  uses-material-design: true
  generate: true
